server:
  # 端口
  port: 8080

############## Sa-Token 配置 (文档: https://sa-token.cc) ##############
sa-token:
  # token 名称（同时也是 cookie 名称）
  token-name: satoken
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: 2592000
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: false
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: uuid
  # 是否输出操作日志
  is-log: true

mybatis:
  configuration-properties:
    helperDialect: mysql    #指定mybatis使用mysql语言对数据库进行操作
    reasonable: true    #使用mybatis提供的数据格式自动优化,比如说去除一些空格
  mapper-locations: classpath*:com/equestria/sosd_blog/Mapper/*.xml   #当使用mybatis提供的动态sql语句时,指定对应xml文件所在位置, 并扫描所有jar包中的所有mapper文件夹中的xml
  type-aliases-package: com.equestria.sosd_blog.Domain    #指定mybatis映射的java实体类的位置
  configuration:
    map-underscore-to-camel-case: true    #在所有的字段映射时开启下划线命名和驼峰命名的自动转换

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    lettuce:
      poll:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: 200

  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:sosd_blogs}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf-8
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

soul:
  auth-bypass: ${SOUL_AUTH_BYPASS:false}
  ai:
    api-key: ${SOUL_AI_API_KEY:}
    base-url: ${SOUL_AI_BASE_URL:https://api.agicto.cn/v1}
    model: ${SOUL_AI_MODEL:ERNIE-Speed-128K}
  migrate:
    english-notes-cleanup:
      enabled: ${SOUL_MIGRATE_ENGLISH_NOTES_CLEANUP_ENABLED:false}
      dry-run: ${SOUL_MIGRATE_ENGLISH_NOTES_CLEANUP_DRY_RUN:true}
    reset-and-seed-healing-notes:
      enabled: ${SOUL_MIGRATE_RESET_AND_SEED_HEALING_NOTES_ENABLED:false}
      target: ${SOUL_MIGRATE_RESET_AND_SEED_HEALING_NOTES_TARGET:200}
      author: ${SOUL_MIGRATE_RESET_AND_SEED_HEALING_NOTES_AUTHOR:Soul Oasis}
  seed:
    healing-notes:
      enabled: true
      target: 200